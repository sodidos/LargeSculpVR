plugins {
    id 'com.android.application'
}

android {
    namespace 'com.large.sdfquest'
    compileSdk 32
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.large.sdfquest'
        minSdk 32
        targetSdk 32
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DLARGE_USE_OPENXR=ON'
                cppFlags '-std=c++17 -Wall -Wextra'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildFeatures {
        prefab true
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.53'
}
